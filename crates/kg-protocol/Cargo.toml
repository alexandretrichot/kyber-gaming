[package]
name = "kg-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
kg-provider = { version = "0.1.0", path = "../kg-provider" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio-util = { version = "0.7.20", features = ["codec"] }

[dev-dependencies]
futures = "0.3.34"
secrecy = "0.10.3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-util"] }
