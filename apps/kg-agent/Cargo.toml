[package]
name = "kg-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures = "0.3.34"
kg-protocol = { version = "0.1.0", path = "../../crates/kg-protocol" }
kg-provider = { version = "0.1.0", path = "../../crates/kg-provider" }
kg-provider-scaleway = { version = "0.1.0", path = "../../crates/kg-provider-scaleway" }
oci-client = { version = "0.18.0", default-features = false, features = ["rustls-tls"] }
secrecy = "0.10.3"
sha2 = "0.11.0"
tar = "0.4.46"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "process", "signal", "io-util"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
kg-provider-scaleway = { path = "../../crates/kg-provider-scaleway" }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["io-util", "net"] }
wiremock = "0.6.5"
